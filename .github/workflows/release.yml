name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]

# One release job at a time, so two CI runs finishing close together cannot bump, tag and publish over
# each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # The green CI run vouches for head_sha only. If master has moved past it (a push that landed while
      # CI ran, or one CI never runs for because of the path filter or [skip ci]), releasing the tip would
      # publish code no CI run tested. Skip instead: the newer commit's own CI success releases it, or
      # the next push that runs CI does.
      - name: Check master is the commit CI tested
        id: tested
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TIP=$(git rev-parse HEAD)
          if [ "$TIP" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "master is at $TIP but CI tested $TESTED_SHA; not releasing untested code"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.tested.outputs.current == 'true'
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: steps.tested.outputs.current == 'true'
      - run: npm run build
        if: steps.tested.outputs.current == 'true'

      - name: Set up Git author
        if: steps.tested.outputs.current == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Get current version
        id: before
        if: steps.tested.outputs.current == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Run release-it
        if: steps.tested.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci || true

      - name: Check if released
        id: release
        if: steps.tested.outputs.current == 'true'
        run: |
          AFTER=$(node -p "require('./package.json').version")
          if [ "${{ steps.before.outputs.version }}" != "$AFTER" ]; then
            echo "Released v$AFTER"
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "No new version to release"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        # npm 12.0.0 fails `publish --provenance` with MODULE_NOT_FOUND for 'sigstore'
        # (packaging regression: the tarball no longer bundles it where libnpmpublish can
        # resolve it). Pin to npm 11 (trusted publishing needs >= 11.5.1) until npm 12 is fixed.
        run: npx --yes npm@11 publish --access public --provenance
